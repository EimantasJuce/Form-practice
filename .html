<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <form autocomplete="off" class="form">

    <div>
        <lable for="fname">Firstname</lable>
        <input type="text" id="fname" name="fname" placeholder="i.e. john" required> 
    
        <lable for="lname">Lastname</lable>
        <input type="text" id="lname" name="lname" placeholder="i.e. smith" required> 
    </div>

    <div>
        <lable for="email">Email Address</lable>
        <input type="text" id="email" name="email" placeholder="i.e. 12345@emailaddress.com" required>
     </div>  
     <div>  
        <lable for="password"> Password </lable>
        <input type="password" id="password" name="password" required> 
        <span class="icon" id="togglePassword">
            <i class="far fa-eye-slash"></i>
        </span>
        <lable for="password">Confirm Password </lable>
        <input type="password" id="password" name="password" required> 
        <span class="icon" id="togglePasswordConfirm">
            <i class="far fa-eye-slash"></i>
        </span>
   </div>
    <br>

    <div>
        <input type="reset">
    </div>

    <br>

    <div>
        <input type="submit">
    </div>

    </form>
</body>
</html>
