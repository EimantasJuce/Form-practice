<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form</title>
</head>
<body>

    <form autocomplete="off" class="form">
    <p class="title">Register</p>
    <div class="form-group">
        <lable for="fname">
        <input type="text" id="fname" name="fname" placeholder="i.e. john" required> 
        <span>Firstname</span>
       </lable>
        <lable for="lname">
        <input type="text" id="lname" name="lname" placeholder="i.e. smith" required> 
       <span>Last name</span>
       </lable>
    </div>

        <lable for="email">
        <input type="text" id="email" name="email" placeholder="i.e. 12345@emailaddress.com" required autocomplete="off">
       <span>Email Address</span>
    </lable>  
      
    <lable for="password">
        <input type="password" id="password" name="password" required> 
        <span>Password</span>
    </lable>
        <lable for="Comfirm password">
        <input type="password" id="confirm password" name="password" required> 
        <span>Confirm Password</span>
    </lable>
   <div>
        <input type="reset">
    </div>
    <button class="submit"> Submit </button>
    <p class="signin">
    Already have an account?
     <a href="#">Signin</a>
    </p>
    </form>
    
</body>
</html>
